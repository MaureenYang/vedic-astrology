<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇門遁甲排盤</title>
<meta name="description" content="時家奇門遁甲排盤：預測盤與終身盤，九宮、九星、八門、八神、四柱、農曆、大運、奇門穿大六壬。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
<link rel="stylesheet" href="css/qimen.css">
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>奇門遁甲排盤<small>預測盤／終身盤</small></h1>
    <a class="back" href="index.html">← 回到吠陀占星排盤</a>
  </header>

  <form id="form" class="card" autocomplete="off">
    <div class="row">
      <span class="lab">西元</span>
      <input type="number" id="year" class="num dark-sel" min="1800" max="2200" required> 年
      <select id="month" class="dark-sel"></select> 月
      <select id="day" class="dark-sel"></select> 日
    </div>
    <div class="row">
      <select id="hour" class="dark-sel"></select> 時
      <select id="minute" class="dark-sel"></select> 分
      <select id="tz" title="時區">
        <option value="480">UTC+8（台灣、中國、香港）</option>
        <option value="540">UTC+9（日本、韓國）</option>
        <option value="420">UTC+7</option>
        <option value="0">UTC+0</option>
        <option value="-300">UTC-5</option>
        <option value="-480">UTC-8</option>
      </select>
      <button type="button" class="btn outline" id="nowBtn">現在</button>
    </div>
    <p class="hint" id="tiangang"></p>
    <div class="row">
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="face">面測</button>
        <button type="button" data-mode="remote">遠測</button>
        <button type="button" data-mode="life" class="on">終身盤</button>
      </div>
    </div>
    <div class="row">
      <span class="lab">問測人</span>
      <input type="text" id="name" placeholder="姓名（選填）" style="width: 12em">
      <div class="seg" id="sexSeg">
        <button type="button" data-sex="M">乾造</button>
        <button type="button" data-sex="F" class="on pink">坤造</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="btn soft" disabled title="刻家奇門尚未提供">刻盤起局</button>
      <button type="submit" class="btn primary">時盤起局</button>
      <button type="button" class="btn outline" id="resetBtn">重置</button>
    </div>
    <div class="opts">
      <div class="kv">
        <span class="lab">十二長生</span>
        <select id="csStem" class="dark-sel"><option value="">選擇天干</option></select>
        <span class="lab">起局法</span>
        <select id="method" class="dark-sel"><option value="chaibu">拆補法</option><option value="zhirun">置閏法</option></select>
        <span class="lab">移星換斗</span>
        <select disabled class="dark-sel"><option>不轉（原盤）</option></select>
      </div>
      <fieldset class="box" style="margin:0">
        <legend>終身盤專用區</legend>
        <div class="kv">
          <span class="lab">換局</span>
          <select id="juOverride" class="dark-sel"></select>
          <span class="lab">換時柱</span>
          <select id="hourOverride" class="dark-sel"></select>
        </div>
      </fieldset>
    </div>
    <fieldset>
      <legend>問測類型</legend>
      <div class="chips" id="chips"></div>
      <div class="usage" id="usage" hidden></div>
    </fieldset>
    <p class="err" id="formError"></p>
  </form>

  <div id="result" hidden>
    <section class="card head" id="head"></section>
    <section class="card">
      <div class="board" id="board"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--red)"></span>擊刑</span>
        <span><span class="dot" style="background:var(--purple)"></span>門迫</span>
        <span><span class="dot" style="background:var(--green)"></span>入墓</span>
        <span><span class="ring" style="width:11px;height:11px"></span> 空亡</span>
        <span><span class="pill horse">馬</span> 馬星</span>
      </div>
    </section>
    <section class="card" id="dayunCard"></section>
    <section class="card" id="haiCard"></section>
    <section class="card" id="starCard"></section>
    <section class="card" id="lirenCard"></section>
    <section class="card" id="keyingCard"></section>
    <section class="card io no-print">
      <span class="lab">匯出／匯入／列印</span>
      <button type="button" id="exportBtn">匯出奇門盤</button>
      <button type="button" id="importBtn">匯入奇門盤</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button type="button" id="printBtn">列印奇門盤</button>
    </section>
  </div>

  <section class="card saved no-print">
    <div class="top">
      <input type="text" id="saveName" placeholder="命主姓名或備註（選填）">
      <button type="button" class="btn outline" id="saveBtn">儲存目前這張盤</button>
    </div>
    <p class="note" id="savedCount"></p>
    <input type="search" id="savedSearch" placeholder="搜尋命主姓名或備註…" style="width:100%">
    <ul id="savedList"></ul>
  </section>

  <p class="note no-print">時家奇門轉盤法；日柱 23 點後算隔日；四柱以節氣換月、立春換年。天文計算使用 Swiss Ephemeris（Moshier 星曆）。</p>
</div>
<script type="module" src="js/qimen-app.js"></script>
</body>
</html>
